# Månadsvis, och mindre uppdateringar samlade i en pull request per
# paketsystem: varje pull request kör CI, och Actions-minuterna är begränsade.
# Nya huvudversioner kommer var för sig. Säkerhetsuppdateringar kommer som
# förut, direkt.
# Inga automatiska rebaser: varje rebase kör CI igen. Vid konflikt: "@dependabot rebase".
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
    ignore:
      # Avbilden följer Nodes LTS-linje (jämna versioner). Dependabot föreslår
      # alltid senaste huvudversionen, även udda versioner utan långtidsstöd
      # (t.ex. 25). Ett byte av LTS görs därför för hand, samtidigt som
      # node-version i .github/workflows/ci.yml; mindre uppdateringar och
      # säkerhetsrättelser inom 24-slim kommer som vanligt.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "disabled"
    open-pull-requests-limit: 5
    groups:
      sma-uppdateringar:
        update-types: ["minor", "patch"]
